[package]
name = "abba-rs"
version = "1.0.0"
edition = "2021"
description = "Abba: a quiet single-user markdown notepad — Rust port"

[[bin]]
name = "abba-rs"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 2
